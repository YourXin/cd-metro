name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Sync Web index.html to Android Assets
        run: |
          cp index.html android/app/src/main/assets/index.html

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/cdmetro-v1.0.4.apk
          ls -lh build_output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdmetro-android-apk
          path: build_output/cdmetro-v1.0.4.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: 成都地铁实时位置安卓版 v1.0.4 (优化状态栏紧凑间隙与顶部空白)
          body: |
            ### 🚇 成都地铁实时列车位置与到站信息 安卓原生版 (v1.0.4)

            - 🎨 **消除状态栏与导航栏间多余空白区域**：修复 Java 容器状态栏内边距与 WebView 内 safe-area-inset-top 双重计算叠加导致顶部空出 70+px 间隙的问题；原生端 WebView 消费顶部 inset 并自动激活紧凑导航栏样式，导航栏紧凑居中展示。
            - ⏱️ **全线在途列车实时计算到站时间**：基于全线在途列车物理位置与站间距拓扑模型精准推算第 1、2、3 辆车动态倒计时。
            - 🚉 **1号线双交路多终点支持**：支持往科学城与往五根松支线列车到站区分。
            - 🔄 **线路元数据 24 小时自动刷新**：既享本地秒开极致性能，又保障新开车站与运营时刻每日自动同步。
          files: build_output/cdmetro-v1.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
