name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/cdmetro-v1.0.1.apk
          ls -lh build_output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdmetro-android-apk
          path: build_output/cdmetro-v1.0.1.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: 成都地铁实时位置安卓版 v1.0.1 (修复状态栏与完全本地缓存)
          body: |
            ### 🚇 成都地铁实时列车位置与到站信息 安卓原生版 (v1.0.1)

            - 🎨 **修复状态栏重叠**：动态接入 WindowInsets，时钟与状态栏完全下移居中，不遮挡标题。
            - ⚡ **全网 19 条线路本地极速缓存**：站点与站间距 0ms 秒开，彻底消灭白屏与等待。
            - 🚀 **原生 50ms 直连**：绕过浏览器跨域限制，手机直连官方成都地铁数据中心。
            - 📱 **适配 Android 15 & 16**：TargetSdk 35，适配 16KB 内存分页与预测性返回手势。
          files: build_output/cdmetro-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
