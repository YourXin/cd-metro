name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Sync Web index.html to Android Assets
        run: |
          cp index.html android/app/src/main/assets/index.html

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/cdmetro-v1.0.5.apk
          ls -lh build_output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdmetro-android-apk
          path: build_output/cdmetro-v1.0.5.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.5
          name: 成都地铁实时位置安卓版 v1.0.5 (前后台智能休眠省电与即时唤醒刷新)
          body: |
            ### 🚇 成都地铁实时列车位置与到站信息 安卓原生版 (v1.0.5)

            - 🔋 **切出后台 0 耗电 0 偷跑流量**：原生 `MainActivity` 覆盖 `onPause` / `onResume` 深度挂起 `pauseTimers()`，前端深度接入 `visibilitychange` 监听；切换到后台或锁屏时，高频轮询定时器与网络请求彻底终止！
            - ⚡ **切回前台即时唤醒秒级刷新**：切回 App 或解锁点亮屏幕瞬间，立即无缝发起最新列车位置与到站推算，倒计时重置，无需手动下拉或苦等下一轮刷新。
            - 🎨 **状态栏紧凑标准布局**：消除状态栏内边距重复叠加，Header 导航栏紧凑居中展示。
            - ⏱️ **全线在途列车物理位置实时计算**：第一、二、三辆车动态倒计时。
          files: build_output/cdmetro-v1.0.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
