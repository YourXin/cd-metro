name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/cdmetro-v1.0.0.apk
          ls -lh build_output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdmetro-android-apk
          path: build_output/cdmetro-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: 成都地铁实时位置安卓版 v1.0.0
          body: |
            ### 🚇 成都地铁实时列车位置与到站信息 安卓原生版 (v1.0.0)

            - 🚀 **极速 50ms 响应**：绕过浏览器 CORS 跨域限制，手机直接直连成都地铁官方数据中心！
            - ⚡ **秒开零延迟**：完整 UI 内置于 APK 本地 assets，离线秒开，全屏沉浸无地址栏。
            - 📱 **桌面独立图标**：完美支持安卓桌面快捷方式。
            - 🔄 **实时在途追踪**：5秒轮询刷新，支持下行/上行双向列车停靠与区间运行展示。
          files: build_output/cdmetro-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
