name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Sync Web index.html to Android Assets
        run: |
          cp index.html android/app/src/main/assets/index.html

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/cdmetro-v1.0.3.apk
          ls -lh build_output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdmetro-android-apk
          path: build_output/cdmetro-v1.0.3.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: 成都地铁实时位置安卓版 v1.0.3 (彻底修复到站时间估算与全线实时计算)
          body: |
            ### 🚇 成都地铁实时列车位置与到站信息 安卓原生版 (v1.0.3)

            - ⏱️ **彻底重构到站时间算法（告别固定 1/5/7min）**：官方接口仅返回 1 辆列车甚至返回空，原代码有 1/5/7min 兜底；现升级为**全网 19 条线路基于全线在途列车物理位置与拓扑索引精准推算**，第一辆、第二辆、第三辆列车到站时间完全真实动态！
            - 🚉 **新增到站距离与状态辅助信息**：每辆车显示实时区间（如 `距 2 站 · 白果林 ➔ 中医大`、`即将进站`、`本站停靠`），终点站或无车时真实提示 `始发站` / `等待发车`。
            - ⚙️ **新增快捷站点记忆与开关**：支持设置「启动默认弹窗上次使用的快捷站点」，默认保持不启用。
            - 🎨 **修复状态栏重叠**：动态接入 WindowInsets，时钟与状态栏完全下移居中，不遮挡标题。
            - ⚡ **全网 19 条线路本地极速缓存**：站点与站间距 0ms 秒开，彻底消灭白屏与等待。
          files: build_output/cdmetro-v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
