name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Sync Web index.html to Android Assets
        run: |
          cp index.html android/app/src/main/assets/index.html

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/cdmetro-v1.0.7.apk
          ls -lh build_output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdmetro-android-apk
          path: build_output/cdmetro-v1.0.7.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.7
          name: 成都地铁实时位置安卓版 v1.0.7 (增加到站校准超时熔断与弱网秒级兜底)
          body: |
            ### 🚇 成都地铁实时列车位置与到站信息 安卓原生版 (v1.0.7)

            - 🛡️ **到站校准接口增加 3.5 秒 AbortController 超时熔断**：在隧道、地下弱网或官方接口偶发抖动无响应时，3.5 秒内自动安全熔断，立即以本地 1.2 分钟高精拓扑模型秒级兜底渲染，彻底杜绝转圈卡死。
            - ⏱️ **平滑无跳变渲染**：彻底消灭 3min ➔ 2min 的中间状态闪烁。
            - 🚉 **100% 对齐官方到站流转**：0.5 站「即将到站」，0 站「列车进站」，长途「n min」。
            - 🔋 **前后台智能休眠与即时唤醒**：锁屏挂起 0 耗电，切回瞬间自动刷新。
          files: build_output/cdmetro-v1.0.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
