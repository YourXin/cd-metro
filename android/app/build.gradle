plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.chengdurail.cdmetro.h5'
    compileSdk 35

    defaultConfig {
        applicationId "cn.chengdurail.cdmetro.h5"
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName "1.0.7"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "cdmetro123"
            keyAlias "cdmetro"
            keyPassword "cdmetro123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Java & WebView. Zero native C/C++ so files!
    // 100% 16KB Page Size compatible with Android 15 and Android 16!
}
