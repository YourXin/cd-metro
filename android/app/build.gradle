plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.chengdurail.cdmetro.h5'
    compileSdk 34

    defaultConfig {
        applicationId "cn.chengdurail.cdmetro.h5"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero heavy dependencies! Ultra lightweight < 2MB APK!
}
