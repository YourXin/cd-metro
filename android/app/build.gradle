plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.chengdurail.cdmetro.h5'
    compileSdk 35

    defaultConfig {
        applicationId "cn.chengdurail.cdmetro.h5"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "1.0.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Java & WebView. Zero native C/C++ so files!
    // 100% 16KB Page Size compatible with Android 15 and Android 16!
}
